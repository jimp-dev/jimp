packages:
  - "packages/*"
  - "plugins/*"
allowBuilds:
  core-js-pure: false
  esbuild: true
  msw: false
  sharp: true
# external-editor (via auto's all-contributors prompts) pins a vulnerable tmp.
overrides:
  external-editor>tmp: ^0.2.6
minimumReleaseAgeExclude:
  - bmp-ts@1.2.0
# pnpm 12 defaults this to "install": every `pnpm run` checks node_modules and
# can start a full workspace install. Turbo runs many `pnpm run` tasks at once,
# and that install relinks node_modules under the tasks that are still running.
verifyDepsBeforeRun: false
