name: build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Enabled permissions on GITHUB_TOKEN
permissions:
  # To be able to push to the repo
  contents: write
  # To update the pr description with canary info
  pull-requests: write
  # For pr-check to create a status
  statuses: write
  # Needed to create PR statuses/checks
  checks: write
  # To post comments on PRs
  issues: write

jobs:
  # Run install in one step so deps can be cached for other steps
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # - uses: ./.github/actions/install-deps

  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/turbo-cache
      - run: pnpm build

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/turbo-cache
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/turbo-cache
      - run: pnpm test

  # "test" runs on the oldest supported Node.js (22); this covers the current LTS
  test-node-24:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
        with:
          node-version: 24
      - uses: ./.github/actions/turbo-cache
      - run: pnpm test

  test-browser:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/turbo-cache
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ./packages/config-vitest
      - run: pnpm test:browser

  # Builds and tests on Windows so the repo keeps working there (#1197)
  test-windows:
    runs-on: windows-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-deps
        with:
          node-version: 22
      - uses: ./.github/actions/turbo-cache
      - run: pnpm build
      # `pnpm test` would build everything again: turbo passes the vitest args
      # to the build tasks too, so their cache entries don't match
      - run: pnpm turbo run test --only -- --watch=false --testTimeout=20000
