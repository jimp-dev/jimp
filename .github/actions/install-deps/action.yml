name: "Setup"
description: Setup action

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Version comes from "packageManager" in package.json
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
