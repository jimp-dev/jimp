    <div class="shead"><h2 id="docs">Documentation</h2><p>Guides walk through common tasks. The API reference covers every method.</p></div>
    <div class="cards">${GUIDES.map((g) => `<a class="gcard" href="#/guides/${g.id}"><span class="ic" style="--c:${g.c}"><svg viewBox="0 0 32 32">${GI[g.ic]}</svg></span><span><b>${g.title}</b><span>${g.desc}</span></span></a>`).join("")}
      <a class="gcard" href="#/api"><span class="ic" style="--c:var(--yellow)"><svg viewBox="0 0 32 32">${GI.api}</svg></span><span><b>API reference</b><span>All ${METHODS.length} image methods, with live previews.</span></span></a></div>
  </div>`;
}

function guidePage(id) {
  const g = G[id];
  const tpl = $(`#g-${id}`);
  return docsLayout(`/guides/${id}`, { tab: "Guide", c: g.c, crumbs: `<a href="#/">Docs</a> › <a href="#/guides/getting-started">Guides</a> › ${g.title}`, title: g.title, desc: g.desc, body: tpl.innerHTML, editPath: `edit/main/packages/docs/src/content/docs/guides/${id}.mdx` });
}

function apiIndexPage() {
  const rot = [-2, 1.5, -1, 2, -1.5, 1];
  const core = [
    ["Jimp.read(input, options?)", "Load from a file path, URL, <code>Buffer</code> or <code>ArrayBuffer</code>."],
    ["Jimp.fromBuffer(buffer, options?)", "Load from an encoded image in memory."],
    ["Jimp.fromBitmap(bitmap)", "Create from raw RGBA data, such as canvas <code>ImageData</code>."],
    ["new Jimp({ width, height, color? })", "Create a blank image."],
    ["image.write(path, options?)", "Encode and save to disk (Node.js). The format comes from the extension."],
    ["image.getBuffer(mime, options?)", "Encode to a <code>Buffer</code>."],
    ["image.getBase64(mime, options?)", "Encode to a data URL."],
    ["image.clone()", "Copy the image, so you can edit the copy."],
    ["image.width, image.height, image.bitmap", "Size and raw RGBA pixel data."],
  ];
  const body = `
    <p>Each method changes the image in place and returns it, so calls can be chained. Every thumbnail below was made by Jimp in your browser. Select a method for its options and a live preview.</p>
    <h2 id="methods">Image methods</h2>
    <div class="bookbar"><input id="apiSearch" type="search" placeholder="Filter methods" aria-label="Filter methods"><div class="filters" id="apiFilters">${[["all", "All"], ...Object.entries(CATS).map(([k, c]) => [k, c.label])].map(([k, l]) => `<button data-f="${k}" aria-pressed="${k === "all"}">${l}</button>`).join("")}</div></div>
    <div class="sheet"><div class="stickers" id="stickers">${METHODS.map((m, i) => `<a class="sticker" href="#/api/${m.id}" data-cat="${m.cat}" data-q="${m.id} ${esc(m.summary.toLowerCase())}" style="--rot:${rot[i % rot.length]}deg; --c:${m.c}; --cc:${CATS[m.cat].c}"><span class="cat">${CATS[m.cat].label}</span><span class="th" id="th-${m.id}"><span class="wait">Rendering…</span></span><span class="nm">${m.id}()</span><p>${esc(m.summary)}</p></a>`).join("")}</div></div>
    <h2 id="core">Loading and saving</h2>
    <p>These are on <code>Jimp</code> and every image, whichever plugins you use.</p>
    <div class="tbl"><table><thead><tr><th>API</th><th>Description</th></tr></thead><tbody>${core.map(([a, d]) => `<tr><td><code>${esc(a)}</code></td><td>${d}</td></tr>`).join("")}</tbody></table></div>
    <p>The <a href="https://jimp-dev.github.io/jimp/api/jimp/classes/jimp/">generated API docs</a> list every export, including methods not shown here such as <code>composite</code>, <code>contain</code>, <code>cover</code>, <code>mask</code> and <code>print</code>.</p>`;
  return docsLayout("/api", { tab: "API", c: "var(--mint)", crumbs: `<a href="#/">Docs</a> › API reference`, title: "API reference", desc: "Every image method in the default <code>jimp</code> package.", body, editPath: "" });
}

function apiMethodPage(id) {
  const m = M[id], d = DOCS[id];
  const hasOpts = d.params.length;
  const table = hasOpts ? `<div class="tbl"><table><thead><tr><th>${/options/.test(d.sig) ? "Option" : "Parameter"}</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>${d.params.map((p) => `<tr><td><code>${p.n}</code></td><td><code>${esc(p.t)}</code></td><td>${p.d === "—" ? (/Required unless/.test(p.desc) ? "—" : "required") : /^[\w."-]+$/.test(p.d) ? `<code>${esc(p.d)}</code>` : esc(p.d)}</td><td>${p.desc}</td></tr>`).join("")}</tbody></table></div>` : `<p>This method takes no options.</p>`;
  const actions = d.actions ? `<h3 id="actions">Actions</h3><div class="tbl"><table><thead><tr><th>apply</th><th>params</th><th>Effect</th></tr></thead><tbody>${d.actions.map(([a, p, e]) => `<tr><td><code>"${a}"</code></td><td><code>${esc(p)}</code></td><td>${e}</td></tr>`).join("")}</tbody></table></div>` : "";
  const body = `
    <p>${d.desc}</p>
    <h2 id="signature">Signature</h2>
    <pre class="code" data-file="${m.id}.d.ts">${esc(d.sig)}</pre>
    <h2 id="options">${/options/.test(d.sig) || !hasOpts ? "Options" : "Parameters"}</h2>
    ${table}${actions}
    <h2 id="example">Example</h2>
    <pre class="code" data-file="example.ts">${esc(d.example)}</pre>
    <h2 id="try-it">Try it</h2>
    <p>${m.controls.length ? "Change an option to re-run the method. The code panel shows the exact call." : "The method runs on the image below. The code panel shows the exact call."}</p>
    <div class="pg-mount" data-tools="${m.id}" data-select="${m.id}" data-single="1"></div>
    ${d.notes ? `<h2 id="notes">Notes</h2>${d.notes}` : ""}
    <h2 id="related">Related</h2>
    <div class="related">${d.related.map((r) => `<a href="#/api/${r}">${r}()</a>`).join("")}</div>`;
  return docsLayout(`/api/${id}`, { tab: CATS[m.cat].label, c: m.c, crumbs: `<a href="#/">Docs</a> › <a href="#/api">API</a> › ${CATS[m.cat].label}`, title: `<code>${id}()</code>`, desc: esc(m.summary), body, editPath: `tree/main/plugins` });
}

function notFoundPage(path) {
  return docsLayout(path, { tab: "404", c: "var(--orange)", crumbs: `<a href="#/">Docs</a>`, title: "Page not found", desc: "", body: `<div class="nf">${JIMPY.replace('id="jimpy"', "")}<div><p>There's no page at <code>${esc(path)}</code>. It may have moved.</p><p><a href="#/">Go to the home page</a>, browse the <a href="#/guides/getting-started">guides</a> or search with <kbd>/</kbd>.</p></div></div>` });
}

async function renderStickers() {
  const run = ++stickerRun;
  await sourceReady;
  if (run !== stickerRun) return;
  const base = SOURCE.img.clone();
  base.resize({ w: 180 });
  for (const m of METHODS) {
    if (run !== stickerRun) return;
    const el = document.getElementById(`th-${m.id}`); if (!el) return;
    try {
      const im = base.clone(), v = defaults(m);
      m.run(im, v, m.plan ? m.plan(im, v) : undefined);
      el.innerHTML = `<img alt="${m.id}() applied to the image" src="${await im.getBase64("image/png")}">`;
    } catch (e) { el.innerHTML = `<span class="wait">${esc(e.message)}</span>`; }
    await wait(0);
  }
}
sourceSubs.add(() => { if (document.getElementById("stickers")) renderStickers(); });
function wireApiIndex() {
  let f = "all";
  const apply = () => {
    const qv = $("#apiSearch").value.trim().toLowerCase();
    $$(".sticker").forEach((s) => { s.style.display = (f === "all" || s.dataset.cat === f) && (!qv || s.dataset.q.includes(qv)) ? "" : "none"; });
  };
  $("#apiSearch").addEventListener("input", apply);
  $("#apiFilters").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; f = b.dataset.f; $$("#apiFilters button").forEach((x) => x.setAttribute("aria-pressed", x === b)); apply(); });
  renderStickers();
}

/* ===================== ROUTER ===================== */
function route() {
  const h = decodeURI(location.hash.replace(/^#/, ""));
  const [p, anchor] = h.split("#");
  let path = p || "/";
  if (!path.startsWith("/")) path = "/";
  if (path.length > 1) path = path.replace(/\/$/, "");
  return { path, anchor };
}
let lastPath = null;
function render() {
  const { path, anchor } = route();
  document.body.classList.remove("nav-open");
  if (path === lastPath) { scrollToAnchor(anchor); return; }
  lastPath = path;
  mounted.forEach((p) => p.destroy()); mounted = []; stickerRun++; cbCount = 0;
  let title = "Jimp · Image processing in plain JavaScript", nav = "";
  const gm = path.match(/^\/guides\/([\w-]+)$/), am = path.match(/^\/api\/([\w-]+)$/);
  if (path === "/") { app.innerHTML = homePage(); }
  else if (gm && G[gm[1]]) { app.innerHTML = guidePage(gm[1]); title = `${G[gm[1]].title} · Jimp`; nav = "guides"; }
  else if (path === "/api") { app.innerHTML = apiIndexPage(); title = "API reference · Jimp"; nav = "api"; }
  else if (am && M[am[1]]) { app.innerHTML = apiMethodPage(am[1]); title = `${am[1]}() · Jimp API`; nav = "api"; }
  else { app.innerHTML = notFoundPage(path); title = "Page not found · Jimp"; }
  document.title = title;
  $$(".topnav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === nav));
  enhance(app);
  buildToc();
  if (path === "/api") wireApiIndex();
  const cur = $(".sidebar a[aria-current]");
  if (cur) { const sb = $(".sidebar"); const top = cur.offsetTop - sb.clientHeight / 2; sb.scrollTop = Math.max(0, top); }
  if (anchor) scrollToAnchor(anchor, false); else scrollTo(0, 0);
  spyToc();
}
function scrollToAnchor(id, smooth = true) {
  if (!id) { scrollTo({ top: 0, behavior: "smooth" }); return; }
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: smooth ? "smooth" : "instant", block: "start" });
}
addEventListener("hashchange", render);

/* ===================== GLOBAL UI ===================== */
document.addEventListener("click", (e) => {
  const cp = e.target.closest("[data-copy-code]");
  if (cp) {
    const cb = cp.closest(".cb"); const text = $("pre", cb).textContent;
    navigator.clipboard?.writeText(text).then(() => { cp.textContent = "Copied"; cp.classList.add("ok"); setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("ok"); }, 1300); }, () => {});
    return;
  }
  const pm = e.target.closest("[data-pm]");
  if (pm && pm.tagName === "BUTTON") {
    pmChoice = pm.dataset.pm;
    $$("[data-pkg]").forEach((box) => {
      const pkg = box.dataset.pkg;
      $$("[data-pm]", box).forEach((b) => b.setAttribute("aria-pressed", b.dataset.pm === pmChoice));
      if (box.classList.contains("install")) $("code", box).innerHTML = `<b>${PM[pmChoice].split(" ")[0]}</b> ${PM[pmChoice].split(" ").slice(1).join(" ")} ${pkg}`;
      else $("pre code", box).innerHTML = hl(`${PM[pmChoice]} ${pkg}`, "sh");
    });
    return;
  }
  const icp = e.target.closest(".install .cp");
  if (icp) { navigator.clipboard?.writeText(`${PM[pmChoice]} jimp`).then(() => { icp.textContent = "Copied"; icp.classList.add("ok"); setTimeout(() => { icp.textContent = "Copy"; icp.classList.remove("ok"); }, 1300); }, () => {}); return; }
  if (e.target.closest("#jimpy")) {
    const j = $("#jimpy"), b = $("#bubble");
    j.classList.remove("bob"); void j.getBoundingClientRect(); j.classList.add("bob");
    const i = (TIPS.indexOf(b.innerHTML) + 1) % TIPS.length; b.innerHTML = TIPS[i < 0 ? 0 : i];
    return;
  }
  if (e.target.closest("[data-close-nav]")) { document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
  const top = e.target.closest("[data-top]");
  if (top) { e.preventDefault(); history.replaceState(null, "", top.getAttribute("href")); scrollTo({ top: 0, behavior: "smooth" }); }
});
$("#menuBtn").addEventListener("click", () => { const on = document.body.classList.toggle("nav-open"); $("#menuBtn").setAttribute("aria-expanded", on); });

/* search */
const INDEX = [];
function buildIndex() {
  INDEX.push({ t: "Introduction", s: "Home", h: "#/" });
  for (const g of GUIDES) {
    INDEX.push({ t: g.title, s: "Guide", h: `#/guides/${g.id}`, k: g.desc });
    const tpl = $(`#g-${g.id}`);
    $$("h2, h3", tpl.content).forEach((h) => INDEX.push({ t: h.textContent, s: `${g.title}`, h: `#/guides/${g.id}#${h.id}` }));
  }
  INDEX.push({ t: "API reference", s: "API", h: "#/api" });
  for (const m of METHODS) INDEX.push({ t: `${m.id}()`, s: `API · ${CATS[m.cat].label}`, h: `#/api/${m.id}`, k: m.summary, code: true });
}
buildIndex();
const qIn = $("#q"), res = $("#results");
let sel = 0, hits = [];
function search() {
  const q = qIn.value.trim().toLowerCase();
  if (!q) { res.classList.remove("on"); return; }
  hits = INDEX.map((x) => {
    const t = x.t.toLowerCase(); let score = 0;
    if (t.startsWith(q)) score = 3; else if (t.includes(q)) score = 2; else if ((x.k || "").toLowerCase().includes(q)) score = 1;
    return [score, x];
  }).filter(([s]) => s).sort((a, b) => b[0] - a[0]).slice(0, 8).map(([, x]) => x);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => `<a href="${x.h}" class="${i === sel ? "sel" : ""}" role="option"><b>${x.code ? `<code>${esc(x.t)}</code>` : esc(x.t)}</b><small>${esc(x.s)}</small></a>`).join("") : `<div class="none">No results for “${esc(qIn.value)}”</div>`;
  res.classList.add("on");
}
qIn.addEventListener("input", search);
qIn.addEventListener("focus", () => qIn.value && search());
qIn.addEventListener("keydown", (e) => {
  const links = $$("a", res);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % Math.max(1, links.length); links.forEach((a, i) => a.classList.toggle("sel", i === sel)); }
  if (e.key === "Enter" && hits[sel]) { location.hash = hits[sel].h.slice(1); qIn.value = ""; res.classList.remove("on"); qIn.blur(); }
  if (e.key === "Escape") { res.classList.remove("on"); qIn.blur(); }
});
res.addEventListener("click", () => { qIn.value = ""; res.classList.remove("on"); });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) res.classList.remove("on"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/input|textarea|select/i.test(e.target.tagName)) { e.preventDefault(); qIn.focus(); }
});

render();
</script>
</body>
</html>
